# Resident controls and experiment Agents use the same fixed-release bundle.
- id: hmr
  disabled: true
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: credentials
  config:
    path: !!js process.env.DSH_EXPERIMENT_MODEL_CREDENTIAL_FILE
    watch: false
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: aspera-confined
    presets:
      aspera-confined:
        sandbox: workspace-write
        approval: never
- insert:
    - id: aspera-http
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.DSH_EXPERIMENT_PORT)
    - id: aspera-presets
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: aspera-single
    - id: aspera-single-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aspera-single
        name: Aspera single Agent
        description: Version-pinned experiment coordination using allocation-scoped tools.
        plugins: []
    - id: aspera-runtime
      name: '@aspera/runtime'
      config:
        role: !!js process.env.DSH_EXPERIMENT_ROLE
        root: !!js process.env.DSH_CLUSTER_ROOT
        tokenFile: !!js process.env.DSH_EXPERIMENT_TOKEN_FILE
        deploymentId: !!js process.env.DSH_EXPERIMENT_DEPLOYMENT_ID
        experimentId: !!js process.env.DSH_CLUSTER_EXPERIMENT
        backendPath: !!js process.env.DSH_EXPERIMENT_BWRAP
        hiddenPaths: !!js (process.env.DSH_EXPERIMENT_HIDDEN_PATHS || '').split(',').filter(Boolean)
        devicePaths: !!js (process.env.DSH_EXPERIMENT_DEVICES || '').split(',').filter(Boolean)
        chunkBytes: !!js Number(process.env.DSH_CLUSTER_CHUNK_BYTES || 65536)
        fileLimit: !!js Number(process.env.DSH_CLUSTER_FILE_LIMIT || 1000)
        cleanupTimeoutMs: !!js Number(process.env.DSH_CLUSTER_CLEANUP_MS || 30000)
        pollIntervalMs: !!js Number(process.env.DSH_CLUSTER_POLL_MS || 1000)
        documentationHosts: !!js JSON.parse(process.env.DSH_CLUSTER_DOCUMENTATION_HOSTS || '["docs.nvidia.com","github.com","raw.githubusercontent.com","swift.readthedocs.io","unsloth.ai","docs.unsloth.ai","huggingface.co"]')
        documentationBytes: !!js Number(process.env.DSH_CLUSTER_DOCUMENTATION_BYTES || 262144)
        goalContinuationWindow: !!js Number(process.env.DSH_CLUSTER_GOAL_WINDOW || 128)
